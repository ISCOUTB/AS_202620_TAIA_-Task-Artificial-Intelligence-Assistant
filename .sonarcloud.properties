# Configuración del análisis automático de SonarCloud (organización isco-utb).
# https://sonarcloud.io/project/overview?id=ISCOUTB_AS_202620_TAIA_-Task-Artificial-Intelligence-Assistant

sonar.sources=.

# Archivos generados por Quarto al renderizar los diagramas C4 (`quarto render`).
# Son librerías de terceros (bootstrap, quarto.js) que el equipo no escribe ni
# mantiene; sus cuatro "bugs" eran los que dejaban el Quality Gate en ERROR.
sonar.exclusions=docs/**/*_files/**,docs/c4/*.html

# El código del cliente se genera desde el contrato OpenAPI
# (tools/generate_api_client.py); el CI comprueba que esté sincronizado.
sonar.cpd.exclusions=backend/generated/**

sonar.python.version=3.12
