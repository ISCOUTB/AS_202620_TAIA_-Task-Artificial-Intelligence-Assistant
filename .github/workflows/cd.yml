
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dokploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Solicitar despliegue en Dokploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Comprobar que CI corresponde al último commit de main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)

          if [ "$current_sha" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Se omite este CI antiguo; main ya cambió."
          fi

      - name: Desplegar Docker Compose mediante webhook de Dokploy
        if: steps.revision.outputs.current == 'true'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          : "${DOKPLOY_WEBHOOK_URL:?Configura el secret DOKPLOY_WEBHOOK_URL}"

          case "$DOKPLOY_WEBHOOK_URL" in
            https://*) ;;
            http://*)
              echo "::warning::El webhook usa HTTP; los datos enviados no están cifrados. Se recomienda HTTPS."
              ;;
            *)
              echo "DOKPLOY_WEBHOOK_URL debe empezar por http:// o https://"
              exit 1
              ;;
          esac

          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            "$DOKPLOY_WEBHOOK_URL"

          echo "Solicitud de despliegue enviada a Dokploy."
          echo "Verifica el resultado y el health check en Dokploy."
