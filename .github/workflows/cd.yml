name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dokploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Solicitar despliegue en Dokploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Comprobar que CI corresponde al último commit de main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Se omite este CI antiguo; main ya cambió."
          fi

      - name: Desplegar Docker Compose mediante la API de Dokploy
        if: steps.revision.outputs.current == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_URL:?Configura el secret DOKPLOY_URL}"
          : "${DOKPLOY_API_KEY:?Configura el secret DOKPLOY_API_KEY}"
          : "${DOKPLOY_COMPOSE_ID:?Configura el secret DOKPLOY_COMPOSE_ID}"
          case "$DOKPLOY_URL" in
            https://*) ;;
            *) echo "DOKPLOY_URL debe usar HTTPS"; exit 1 ;;
          esac
          payload=$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg sha "$TESTED_SHA" \
            '{composeId: $id, title: ("CI main " + $sha)}')
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --request POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload"
          echo "Solicitud aceptada. Consulta el resultado y el health check en Dokploy."
