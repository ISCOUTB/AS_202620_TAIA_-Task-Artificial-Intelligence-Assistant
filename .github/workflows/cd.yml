name: CD

# Se dispara solo cuando el workflow "CI" termina en verde sobre main.
# Así el pipeline nunca publica ni despliega una imagen que no pasó las pruebas.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    name: Build & push imagen a GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Calcular tag de imagen
        id: vars
        env:
            COMMIT_SHA: ${{ github.event.workflow_run.head_sha}}
        run: echo "image_tag=${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GHCR_USERNAME/GHCR_PAT: mismo usuario y PAT (write:packages, read:packages)
          # que se usa hoy manualmente con `docker login ghcr.io`.
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/dei0811/taia_backend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/dei0811/taia_backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en la VPS Oracle
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Actualizar contenedor por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          # Secrets a crear en Settings → Secrets and variables → Actions:
          #   OCI_HOST     -> 157.137.215.57
          #   OCI_USER     -> opc
          #   OCI_SSH_KEY  -> contenido privado de ~/.ssh/oci_taia.key
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            IMAGE="ghcr.io/dei0811/taia_backend:${{ needs.build-and-push.outputs.image_tag }}"

            echo "Descargando $IMAGE"
            sudo docker pull "$IMAGE"

            echo "Deteniendo contenedor anterior (si existe)"
            sudo docker stop taia_backend || true
            sudo docker rm taia_backend || true

            echo "Creando contenedor nuevo"
            sudo docker run -d \
              --name taia_backend \
              --env-file ~/taia.env \
              -p 8000:8000 \
              --restart unless-stopped \
              "$IMAGE"

            echo "Estado tras el despliegue:"
            sudo docker ps --filter "name=taia_backend"

      - name: Verificar health check externo
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
                --connect-timeout 5 \
                "http://${{ secrets.OCI_HOST }}:8000/health"; then
              echo "✓ Health check passed"
              exit 0
            fi

            echo "Health check failed (attempt $attempt/12), retrying in 5s..."
            sleep 5
          done

          echo "✗ Service did not respond after 60 seconds"
          exit 1