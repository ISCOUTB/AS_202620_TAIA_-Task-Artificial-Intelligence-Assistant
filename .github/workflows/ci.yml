name: CI

on:
  push:
    branches: [main]
    # Cada patrón es un elemento de la lista ("- 'patrón'"). Sin el espacio
    # después del guion, YAML lo lee como un solo texto y no como una lista.
    paths:
      - 'backend/**'
      - 'tools/**'
      - 'docker-compose.yml'
      - 'pytest.ini'
      - '.sonarcloud.properties'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tools/**'
      - 'docker-compose.yml'
      - 'pytest.ini'
      - '.sonarcloud.properties'
      - '.github/workflows/ci.yml'

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17   # igualar a la versión de tu proyecto Supabase
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/taia
      # Base efímera del runner. NUNCA apuntar a Supabase: conftest.py
      # ejecuta "alembic downgrade base" al iniciar la sesión.
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/taia_test
      # Marcador de posición. `app.main` compone el adaptador de Gemini al
      # importar, así que sin la variable el fallo aparece al importar.
      # Ninguna prueba llama a la API real: el LLM se sustituye por FakeLLM
      # o por httpx.MockTransport.
      GEMINI_API_KEY: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Valida el Dockerfile antes de tocar Supabase. Dokploy volverá a
      # construir la imagen, pero así un Dockerfile roto falla aquí y no
      # después de migrar la base.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 

      - name: Build backend image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # El Dockerfile hace COPY backend/..., así que el contexto es la raíz
          # del repo y el Dockerfile se indica aparte.
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: taia-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pip==26.2.1
          pip install --require-hashes --only-binary :all: -r backend/requirements-dev.lock.txt

      - name: Create databases if needed
        run: |
          for db in taia taia_test; do
            psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 || \
            psql -h localhost -U postgres -c "CREATE DATABASE $db;"
          done

      - name: Run full test suite
        run: python -m pytest backend/tests -q -rs

      # Ejercita lo que el build no cubre: el CMD de la imagen (alembic upgrade
      # head && uvicorn) contra un Postgres vacío, igual que en Dokploy.
      - name: Smoke test image (migrations + startup)
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -c "CREATE DATABASE taia_boot;"
          docker run -d --name taia-smoke --network host \
            -e DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/taia_boot \
            -e GEMINI_API_KEY=ci-placeholder \
            -e TAIA_JWT_SECRET="$(openssl rand -hex 32)" \
            taia-backend:ci
          ok=""
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000/; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' taia-smoke)" != "true" ]; then break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "La imagen no arrancó o no migró:"
            docker logs taia-smoke
            exit 1
          fi
          psql -h localhost -U postgres -d taia_boot -tc "SELECT 1 FROM alembic_version" | grep -q 1

      - name: Stop smoke container
        if: always()
        run: docker rm -f taia-smoke || true

      - name: Verify boundaries and credentials
        run: |
          python tools/audit_boundaries.py
          python tools/verificar_dependencias.py

      - name: Regenerate API client from OpenAPI contract
        run: python tools/generate_api_client.py

      - name: Verify generated client is synchronized
        run: git diff --exit-code -- backend/generated/taia_api_client.py

  # SonarCloud analiza cada commit con su análisis automático (organización
  # isco-utb); por eso no se ejecuta un escáner aquí: SonarCloud rechaza el
  # análisis desde CI mientras el automático está activo. Este job espera el
  # análisis del mismo commit y falla si el Quality Gate no está en OK, para que
  # el resultado quede en el run y CD no despliegue con el gate en rojo.
  # El proyecto es público: la consulta no necesita token.
  quality-gate:
    name: SonarCloud Quality Gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_PROJECT: ISCOUTB_AS_202620_TAIA_-Task-Artificial-Intelligence-Assistant
      SONAR_API: https://sonarcloud.io/api
    steps:
      - name: Esperar el análisis del commit y comprobar el Quality Gate
        run: |
          set -euo pipefail
          analysis=""
          for _ in $(seq 1 40); do
            analysis=$(curl -sf "$SONAR_API/project_analyses/search?project=$SONAR_PROJECT&ps=20" \
              | jq -r --arg sha "$GITHUB_SHA" '.analyses[] | select(.revision == $sha) | .key' | head -n1)
            if [ -n "$analysis" ]; then break; fi
            sleep 15
          done
          if [ -z "$analysis" ]; then
            echo "SonarCloud no publicó un análisis para $GITHUB_SHA en 10 minutos."
            exit 1
          fi
          status=$(curl -sf "$SONAR_API/qualitygates/project_status?analysisId=$analysis")
          echo "$status" | jq '.projectStatus.conditions[] | {metricKey, status, actualValue, errorThreshold}'
          gate=$(echo "$status" | jq -r '.projectStatus.status')
          echo "Quality Gate: $gate"
          echo "https://sonarcloud.io/project/overview?id=$SONAR_PROJECT"
          [ "$gate" = "OK" ]
