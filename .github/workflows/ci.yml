name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taia
      # Sin esta variable, backend/tests/conftest.py omite en silencio toda
      # prueba de integracion con PostgreSQL y el CI pasa sin ejercitar la
      # capa de datos. Apunta a una base separada: conftest.py ejecuta
      # "alembic downgrade base" al iniciar la sesion.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taia_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes --only-binary :all: -r backend/requirements-dev.lock.txt

      - name: Create databases if needed
        run: |
          for db in taia taia_test; do
            PGPASSWORD=postgres psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 || \
            PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE $db;"
          done

      - name: Run full test suite
        run: python -m pytest backend/tests -q

      - name: Regenerate API client from OpenAPI contract
        run: python tools/generate_api_client.py

      - name: Verify generated client is synchronized
        run: git diff --exit-code -- backend/generated/taia_api_client.py