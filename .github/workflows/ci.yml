name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taia

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes --only-binary :all: -r backend/requirements-dev.lock.txt

      - name: Create database if needed
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'taia'" | grep -q 1 || \
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE taia;"

      - name: Run real API contract/integration suite
        run: python -m pytest backend/tests/test_api_contract.py -q

      - name: Regenerate API client from OpenAPI contract
        run: python tools/generate_api_client.py

      - name: Verify generated client is synchronized
        run: git diff --exit-code -- backend/generated/taia_api_client.py