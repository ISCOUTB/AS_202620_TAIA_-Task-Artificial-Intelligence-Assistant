services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL para PostgreSQL}
      TAIA_JWT_SECRET: ${TAIA_JWT_SECRET:?Configura TAIA_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TAIA_TELEGRAM_BOT_TOKEN: ${TAIA_TELEGRAM_BOT_TOKEN:-}
      TAIA_TELEGRAM_BOT_USERNAME: ${TAIA_TELEGRAM_BOT_USERNAME:-taia_bot}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
